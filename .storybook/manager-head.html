<script>
  (() => {
    const faviconHref = "/openremote.png?v=openremote-fleets-storybook";

    const applyFleetsFavicon = () => {
      document
        .querySelectorAll('link[rel~="icon"], link[rel="apple-touch-icon"]')
        .forEach((link) => link.remove());

      const favicon = document.createElement("link");
      favicon.rel = "icon";
      favicon.type = "image/png";
      favicon.href = faviconHref;
      document.head.appendChild(favicon);

      const shortcut = document.createElement("link");
      shortcut.rel = "shortcut icon";
      shortcut.type = "image/png";
      shortcut.href = faviconHref;
      document.head.appendChild(shortcut);

      const appleTouchIcon = document.createElement("link");
      appleTouchIcon.rel = "apple-touch-icon";
      appleTouchIcon.href = faviconHref;
      document.head.appendChild(appleTouchIcon);
    };

    applyFleetsFavicon();
    window.addEventListener("DOMContentLoaded", applyFleetsFavicon, { once: true });
  })();
</script>
