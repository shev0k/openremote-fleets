name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run typecheck:mock
      - run: npm run build
      - run: npm run check:bundle:real
      - run: npm run build:mock
      - run: npm run check:bundle:mock
      - run: git diff --check
      - run: test -z "$(git status --short openremote-manager)"
